<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odhlášení — Autorion Events</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #0e0d0b;
    --color-accent: #b8924a;
    --color-surface: #f7f4ef;
    --color-muted: #8a8070;
    --color-border: #d6cfc3;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-mono: 'Geist Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-surface);
    color: var(--color-primary);
    font-family: var(--font-display);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 56px 40px;
  }
  .icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px;
    font-size: 24px;
  }
  h1 {
    font-size: 30px;
    font-weight: 400;
    margin-bottom: 16px;
  }
  h1 em { font-style: italic; color: var(--color-accent); }
  p {
    font-size: 17px;
    line-height: 1.65;
    color: #4a463e;
  }
  .muted {
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--color-muted);
    letter-spacing: 0.02em;
  }
  .error { color: #a33f2e; }
  .btn {
    margin-top: 28px;
    background: var(--color-primary);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 14px 28px;
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .btn:hover { background: #2a2722; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="icon">✉</div>
  <h1>Odhlášení z <em>e-mailů</em></h1>
  <p>Opravdu už nechcete dostávat e-maily k této akci? Odhlášení potvrďte tlačítkem níže.</p>
  <button class="btn" id="confirmBtn" type="button">Potvrdit odhlášení</button>
  <div class="muted">Pokud jste na odkaz klikli omylem, stačí okno zavřít.</div>
</div>

<script>
const API_BASE = 'https://autorion.net/api';

function getTokenFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('token');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showMissingToken() {
  document.getElementById('card').innerHTML = `
    <div class="icon">✕</div>
    <h1>Chybí odkaz</h1>
    <p class="error">V adrese chybí potřebný identifikátor. Zkontrolujte prosím, že jste odkaz otevřeli celý, přímo z e-mailu.</p>`;
}

// Odhlášení se provede až po kliknutí na tlačítko. Pouhé otevření odkazu
// (např. automatická kontrola odkazů v e-mailové schránce) nikoho neodhlásí.
async function unsubscribe() {
  const card  = document.getElementById('card');
  const token = getTokenFromUrl();
  if (!token) { showMissingToken(); return; }

  card.innerHTML = `
    <div class="icon">⏳</div>
    <h1>Zpracováváme...</h1>
    <p>Chvilku strpení.</p>`;

  try {
    const res = await fetch(`${API_BASE}/guests/unsubscribe/${encodeURIComponent(token)}`);
    if (!res.ok) {
      card.innerHTML = `
        <div class="icon">✕</div>
        <h1>Odkaz nenalezen</h1>
        <p class="error">Tento odkaz už není platný, nebo byl použit už dříve.</p>`;
      return;
    }
    const data = await res.json();
    card.innerHTML = `
      <div class="icon">✓</div>
      <h1>Odhlášeno</h1>
      <p>Hotovo, k akci${data.event_name ? ` <em>${escapeHtml(data.event_name)}</em>` : ''} vám už nebudeme posílat další e-maily.</p>
      <div class="muted">Tým Autorion</div>`;
  } catch (err) {
    card.innerHTML = `
      <div class="icon">✕</div>
      <h1>Nepodařilo se to</h1>
      <p class="error">Zkuste to prosím později, nebo nám napište přímo.</p>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (!getTokenFromUrl()) { showMissingToken(); return; }
  document.getElementById('confirmBtn').addEventListener('click', unsubscribe);
});
</script>

</body>
</html>
